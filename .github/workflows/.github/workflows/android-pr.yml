name: Android PR compile test lint
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-pr-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Compile, unit tests and lint (no signing or APK release)
        run: gradle --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug
